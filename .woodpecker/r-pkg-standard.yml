matrix:
  IMAGE:
    - rocker/verse

when:
  - event: push
    branch: "${CI_REPO_DEFAULT_BRANCH}"
  - event: pull_request
  - event: tag

variables:
  step_branch_env: &branch_env
    - name: branch_env
      image: ${IMAGE}
      commands:
        - echo $CI_COMMIT_SOURCE_BRANCH
        - echo $CI_COMMIT_SOURCE_BRANCH

steps:
  - <<: *branch_env

