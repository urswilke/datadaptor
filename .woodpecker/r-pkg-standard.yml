matrix:
  IMAGE:
    - rocker/verse

when:
  - event: push
    branch: "${CI_REPO_DEFAULT_BRANCH}"
  - event: pull_request
  - event: tag

variables:
  step_trigger_ct: &trigger_ct
    - name: trigger_ct
      image: woodpeckerci/plugin-trigger
      settings:
        repositories:
          - urswilke/crosstabser@pr-ci-from-branch
        params:
          TARGET_BRANCH_VAR=pr-ci-from-branch
        token:
          from_secret: WOODPECKER_TRIGGER_TOKEN


steps:
  - <<: *trigger_ct
