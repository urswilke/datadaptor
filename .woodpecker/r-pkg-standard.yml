matrix:
  IMAGE:
    - rocker/verse

when:
  - event: push
    branch: "${CI_REPO_DEFAULT_BRANCH}"
  - event: pull_request
  - event: tag

variables:
  step_branch_env: &branch_env
    - name: branch_env
      image: alpine/git
      commands:
        # 1. Fetch remote branches from the repository (Using # as the sed delimiter)
        - BRANCH_ARRAY=$$(git ls-remote https://codeberg.org/urswilke/crosstabser | grep refs/head | sed 's#.*/heads/##g')

        # 2. Check if the current branch exists in that list and write directly to an environment file
        - |
          if echo "$${BRANCH_ARRAY}" | grep -qxF "$${CI_COMMIT_SOURCE_BRANCH}"; then
            echo "Branch found! Exporting suffix..."
            echo "PLUGIN_REPOSITORIES=urswilke/crosstabser@$${CI_COMMIT_SOURCE_BRANCH}" > trigger.env
          else
            echo "Branch not found! Using default..."
            echo "PLUGIN_REPOSITORIES=urswilke/crosstabser" > trigger.env
          fi

  step_trigger_ct: &trigger_ct
    - name: trigger_ct
      image: woodpeckerci/plugin-trigger
      depends_on: [branch_env]
      # We tell Woodpecker to inject our tracking file variables directly into the plugin container environment
      secrets:
        - source: trigger.env
          target: trigger.env
      settings:
        # The trigger plugin natively reads 'repositories' from the environment when configured via 'from_env'
        repositories:
          from_env: PLUGIN_REPOSITORIES
        token:
          from_secret: WOODPECKER_TRIGGER_TOKEN


steps:
  - <<: *branch_env
  - <<: *trigger_ct
